- name: create ec2 and r53 records
  hosts: all
  connection: local
  vars:
    sg_id: sg-0139ab60908a92954
    ami_id: ami-0055977a6e828a4f4
    domain_name: sivatech-dev.online
    environment: dev
    instances:
      - mongodb
      - catalogue
  tasks:
  - name: create ec2 instance
    amazon.aws.ec2_instance:
      instance_type: "t3.micro"
      image_id: "{{ ami_id }}"
      security_group: "{{ sg_id }}"
      name: "{{ item }}-{{ environment }}"
      tags:
       Project: roboshop
       Component: "{{ item }}"
       Environment: "{{ environment }}"
       Name: "{{ item }}-{{ environment }}"
    loop: "{{ instances }}"
    register: ec2_output

  - name: print the output
    ansible.builtin.debug:
      msg: "Ec2 Output: {{ ec2_output }}"

  - name: create r53 record
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ item.item }}-{{ environment }}.{{ domain_name }}" # mongodb-dev.sivatech-dev.online
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}"
      wait: true
    loop: "{{ ec2_output.results }}"

- name: create r53 record
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "roboshop-{{ environment }}.{{ domain_name }}" # roboshop-dev.sivatech-dev.online
      type: A
      ttl: 1
      value: "{{ item.instances[0].public_ip_address }}"
      wait: true
    loop: "{{ ec2_output.results }}"
    when: item.item == "frontend"